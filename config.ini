; =============================================================================
; VetVopros — несекретные настройки приложения
; =============================================================================
; Секреты (токены, пароли БД, ключи API) храните ТОЛЬКО в файле .env — см. .env.example
; Полный перечень переменных окружения и смысл секций: 09_config_and_env.md
; Явный путь к этому файлу: переменная окружения VETVOPROS_CONFIG_INI
; =============================================================================

[app]
; ---------------------------------------------------------------------------
; Общие параметры процесса и логирования
; ---------------------------------------------------------------------------
; name — короткое имя приложения для логов и метрик (не секрет).
name = vetvopros

; environment — стадия: development | staging | production.
; При production бот и админка не пишут логи в консоль (stdout/stderr), uvicorn — без access-log;
; предупреждения warnings тоже подавляются. Ошибка «нет таблицы users» при старте бота по-прежнему
; выводит подсказку в stderr и завершает процесс.
environment = development
#environment = production

; log_level — уровень логирования: DEBUG, INFO, WARNING, ERROR, CRITICAL.
; Регистр не важен (в коде обычно приводится к верхнему).
log_level = INFO

[paths]
; ---------------------------------------------------------------------------
; Каталоги и файлы промптов относительно корня репозитория (или абсолютные пути).
; Тексты дисклеймеров лежат под texts_dir; системные инструкции для LLM — под prompts.
; ---------------------------------------------------------------------------
; texts_dir — папка с markdown-файлами: дисклеймеры, red flag, «лимит исчерпан», ошибки.
texts_dir = texts

; prompts_dir — базовая папка для текстовых промптов (если пути ниже заданы относительно).
prompts_dir = prompts

; system_prompt_file — основной системный промпт для чата (общие медицинские ограничения и стиль).
system_prompt_file = prompts/system_prompt.md

; prompt_analysis_suggestions — промпт сценария «какие анализы могут обсуждаться с врачом».
prompt_analysis_suggestions = prompts/analysis_suggestions.md

; prompt_analysis_interpretation — промпт осторожной интерпретации лабораторных значений (не диагноз).
prompt_analysis_interpretation = prompts/analysis_interpretation.md

; prompt_analysis_multiturn_* — шаблон user-сообщения при втором и следующих ходах в сценарии «Анализы» (плейсхолдеры @@MVP_PRIOR@@, @@MVP_USER@@).
prompt_analysis_multiturn_suggestions = prompts/analysis_multiturn_suggestions.md
prompt_analysis_multiturn_interpretation = prompts/analysis_multiturn_interpretation.md

; red_flag_response_file — ответ при эскалации (red flags), без вызова RAG/LLM для диагностики.
red_flag_response_file = red_flag_response.md
; red_flags_keywords_file — дополнительные подстроки red flag (по одной на строку; строки с # — комментарии).
red_flags_keywords_file = red_flags_keywords.md
; analysis_interpretation_disclaimer_file — дисклеймер сценария «интерпретация анализов» (UI + префикс системного промпта).
analysis_interpretation_disclaimer_file = analysis_interpretation_disclaimer.md

[database]
; ---------------------------------------------------------------------------
; Параметры пула подключений SQLAlchemy к PostgreSQL.
; Сам URL базы задаётся в .env как DATABASE_URL (не хранить в этом файле).
; ---------------------------------------------------------------------------
; pool_size — число соединений в пуле на процесс; увеличивайте при росте нагрузки и после замеров.
pool_size = 5

[telegram]
; ---------------------------------------------------------------------------
; Поведение Telegram-бота (aiogram). Токен бота — только TELEGRAM_BOT_TOKEN в .env.
; ---------------------------------------------------------------------------
; polling_timeout — таймаут long polling в секундах (сколько ждать ответ от Telegram до нового запроса).
; Используется при вызове start_polling / настройке сессии; слишком мало — лишние запросы, слишком много — дольше «засыпание» при остановке.
polling_timeout = 60

; GROUP_IDS — список chat_id Telegram-групп/каналов (через запятую), куда бот будет слать уведомления:
; - при /start: ID, имя, username пользователя
; - при ответе ассистента: ID, имя, username + вопрос + ответ
; Примеры: -1001234567890,-1009876543210
; Если пусто — уведомления отключены.
group_ids = -1003737019955

; admin_ids — список telegram user id (через запятую), для которых отключены лимиты:
; - ответы ассистента (billing.can_answer / check_and_consume_answer_credit)
; - сообщения специалисту (billing.can_send_specialist_message / record_specialist_message)
; Для таких пользователей квота НЕ списывается — в «Личном кабинете» счётчики останутся 0.
; Пример: 123456789,987654321
; Оставьте пустым или закомментируйте, если нужно тестировать списание на своём аккаунте.
admin_ids = 449466944

[rag]
; ---------------------------------------------------------------------------
; Retrieval: разбиение документов, эмбеддинги, поиск по pgvector.
; Должно совпадать с логикой в 04_rag_design.md и с размерностью вектора в БД.
; ---------------------------------------------------------------------------
; chunk_size_chars — целевой размер фрагмента текста при чанкинге (в символах; грубая метрика MVP).
; Меньше — точнее привязка, больше шум; больше — больше контекста, но риск «размытия» поиска.
chunk_size_chars = 900

; chunk_overlap_chars — перекрытие соседних чанков, чтобы не резать смысл на стыке абзацев.
chunk_overlap_chars = 120

; top_k — сколько ближайших чанков запрашивать у векторного поиска перед фильтрацией по порогу.
top_k = 5

; min_similarity — минимальная релевантность (0..1), обычно как cosine similarity для совпадения с порогом «RAG попал».
; Ниже порога — переход к fallback LLM без опоры на чанки (см. 04_rag_design.md).
#min_similarity = 0.72
min_similarity = 0.55

; max_context_chunks — максимум чанков, отобранных после порога, уходящих в контекст LLM (ограничение длины и стоимости).
max_context_chunks = 4

; embedding_model — идентификатор модели эмбеддингов у провайдера (OpenAI-compatible); должен совпадать с тем, чем считались векторы в БД.
embedding_model = text-embedding-3-small

; embedding_dimensions — размерность вектора (1536 для text-embedding-3-small). ОБЯЗАНА совпадать с типом vector(N) в PostgreSQL/pgvector.
embedding_dimensions = 1536

[llm]
; ---------------------------------------------------------------------------
; Чат-модель для ответов и при необходимости перефразирования с RAG-контекстом.
; Ключ API и опционально LLM_BASE_URL — в .env.
; ---------------------------------------------------------------------------
; chat_model — имя модели в API провайдера. Должно совпадать с тем, что принимает ваш endpoint (иначе часто HTTP 400).
; Для api.openai.com см. список моделей в кабинете; пример рабочего имени: gpt-4o-mini, gpt-4o.
chat_model = gpt-4o-mini
#chat_model = gpt-5.4-mini

; request_timeout_seconds — таймаут HTTP-запроса к LLM; при превышении — обработка ошибки без зависания бота.
request_timeout_seconds = 90

; max_output_tokens — верхняя граница длины ответа модели (completion), снижает риск чрезмерно длинных сообщений в Telegram.
max_output_tokens = 1024

; max_retries — повторы при таймауте, сетевых сбоях и HTTP 429/502/503/504 (между попытками — пауза с backoff).
max_retries = 2

; retry_backoff_seconds — базовая пауза перед повтором; фактическая задержка растёт экспоненциально (и учитывает Retry-After при 429).
retry_backoff_seconds = 1.0

; reduce_log_detail — true: в логах не пишутся превью полного текста промптов/ответа (только длины, модель, latency). Рекомендуется для production.
reduce_log_detail = false

; history_messages — сколько последних сообщений (user/assistant) подтягивать из БД в LLM как контекст.
; 0 = без «памяти» (каждый вопрос отдельный); 6–12 обычно достаточно для связных уточнений.
history_messages = 5

[features]
; ---------------------------------------------------------------------------
; Флаги включения подсистем (true/false, 1/0, yes/no — как парсит приложение).
; ---------------------------------------------------------------------------
; enable_analyses_flow — сценарии «рекомендации анализов» и «интерпретация анализов» в боте.
enable_analyses_flow = true

; enable_specialist_menu — показ меню подбора специалиста из секций specialist_* ниже.
enable_specialist_menu = true

; auto_index_on_publish — после публикации документа в админке автоматически запускать переиндексацию (если реализовано).
auto_index_on_publish = true

[admin]
; ---------------------------------------------------------------------------
; Веб-админка (FastAPI).
; ---------------------------------------------------------------------------
; max_form_bytes — максимальный размер формы при сохранении документа (Markdown), в байтах.
; Если текст большой, увеличьте (например 10MB = 10485760).
max_form_bytes = 10485760

[billing]
; ---------------------------------------------------------------------------
; Лимиты монетизации (детали списания — 07_billing_and_limits.md).
; ---------------------------------------------------------------------------
; free_answers_per_user — сколько ответов «ассистента» доступно бесплатно на пользователя (политика MVP; уточнять у продукта).
free_answers_per_user = 50

; free_specialist_messages_per_user — единиц квоты (см. specialist_message_cost) бесплатно на пользователя для чата со специалистом.
free_specialist_messages_per_user = 3

; specialist_message_cost — сколько «кредитов ответа» списывать за одно сообщение пациента специалисту после исчерпания бесплатных (минимум 1 в коде).
specialist_message_cost = 1

; chargeable_answer_sources — через запятую: значения source ассистента, за которые списывается квота (см. 07_billing_and_limits.md).
; Не включайте guardrail, billing_block, error.
chargeable_answer_sources = rag_llm,rag,llm,analysis_suggestions,analysis_interpretation

; ---------------------------------------------------------------------------
; Ветеринарные специалисты: для каждой специализации — отдельная секция [specialist_<код>].
; Код в имени секции (латиница) используется внутри бота; display_name — текст в меню.
; Для релея в Telegram обязательно задайте telegram_user_id (числовой id пользователя в Telegram).
; telegram_username и url — опционально (подпись, ссылка на сайт); релей идёт только через id.
; Позже список можно перенести в БД.
; ---------------------------------------------------------------------------

[specialist_general_vet]
display_name = Ветеринар общей практики
telegram_user_id = 0
telegram_username = replace_me
note = Не для экстренных случаев. Укажите реальный telegram_user_id ветеринара.

[specialist_surgeon_vet]
display_name = Ветеринар-хирург
telegram_user_id = 0
telegram_username = replace_me
note = Укажите реальный telegram_user_id специалиста для релея через бота.

[specialist_derm_vet]
display_name = Ветеринар-дерматолог
telegram_user_id = 0
url = https://example.com
note = Укажите реальный telegram_user_id специалиста для релея через бота.
