[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vetvopros"
version = "0.1.0"
description = "Veterinary reference Telegram bot (RAG + LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "aiogram>=3.4,<4",
    "fastapi>=0.110,<1",
    "python-multipart>=0.0.9,<1",
    "itsdangerous>=2.1,<3",
    "uvicorn[standard]>=0.27,<1",
    "jinja2>=3.1,<4",
    "markdown>=3.5,<4",
    "httpx>=0.27,<1",
    "pgvector>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vetvopros*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need PostgreSQL + DATABASE_URL",
]
