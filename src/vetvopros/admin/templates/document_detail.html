{% extends "base.html" %}
{% block title %}{{ doc.title }} — Admin{% endblock %}
{% block body %}
<h1>{{ doc.title }}</h1>
<p class="muted">slug: {{ doc.slug }} · статус: {{ doc.status }} · чанков: {{ chunk_count }} · обновлён: {{ doc.updated_at }}</p>
<p class="row-actions">
  <a href="/documents/{{ doc.id }}/edit" class="btn">Правка</a>
  <a href="/documents" class="btn btn-secondary">К списку</a>
</p>
<div class="prose">{{ html_body | safe }}</div>
{% endblock %}
